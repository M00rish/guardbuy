# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "dce5dc4798076e593ee92fdb94304477"
application_url = "https://example.com"
embedded = true
name = "GuardBuy"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Least privilege: read products and orders (daily sales totals, refunds); write_inventory only so the
# demo can reset stock (judge mode). Seeding a new dev store needs write_products, write_orders and
# write_publications added temporarily (scripts/seed-dev-store.ts).
scopes = "read_products,read_orders,write_inventory"
optional_scopes = [ ]
use_legacy_install_flow = false

[webhooks]
api_version = "2026-10" # keep in step with apiVersion in app/shopify.server.ts

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # The agent's trigger: stock changed somewhere in the store
  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory_levels/update"
  topics = [ "inventory_levels/update" ]

  # Keeps daily sales totals current (variant, quantity and date only)
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  # Refunds and cancellations take units back out of the sales totals
  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

[auth]
redirect_urls = [ ]

# Judges reach GuardBuy on the storefront at https://<shop>/apps/guardbuy (no Shopify login needed)
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "guardbuy"

[build]
# Point the app URL and redirect URLs at the current dev tunnel on every `shopify app dev`
automatically_update_urls_on_dev = true
