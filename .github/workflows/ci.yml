name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck + policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      # Offline, deterministic checks (no database, PayPal or Gemini needed)
      - run: npx tsx scripts/check-payout-refresh.ts
      - run: npx tsx scripts/check-policy.ts
      - run: npx tsx scripts/check-scoreboard.ts
      - run: node --import tsx scripts/check-checkpoints.ts
