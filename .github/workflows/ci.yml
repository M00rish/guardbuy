name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: offline-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Offline, deterministic checks (no database, PayPal or Gemini needed)
      - run: npx tsx scripts/check-deliveries.ts
      - run: npx tsx scripts/check-incoming-stock.ts
      - run: npx tsx scripts/check-public-demo.ts
      - run: npx tsx scripts/check-insights.ts
      - run: npx tsx scripts/check-insights-queries.ts
      - run: npx tsx scripts/check-insights-routes.ts
      - run: npx tsx scripts/check-insights-planner.ts
      - run: npx tsx scripts/check-payout-refresh.ts
      - run: npx tsx scripts/check-payment-attempts.ts
      - run: npx tsx scripts/check-unpaid-approvals.ts
      - run: npx tsx scripts/check-paypal-binding.ts
      - run: node scripts/check-access-logs.mjs
      - run: npx tsx scripts/check-payment-status.ts
      - run: npx tsx scripts/check-verify-status.ts
      - run: npx tsx scripts/check-payment-http.ts
      - run: npx tsx scripts/check-paypal-errors.ts
      - run: npx tsx scripts/check-merchant-feedback.ts
      - run: npx tsx scripts/check-policy.ts
      - run: npx tsx scripts/check-scoreboard.ts
      - run: node --import tsx scripts/check-checkpoints.ts

      - name: Create and migrate isolated test databases
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          for test_database in guardbuy_ism135_test guardbuy_ism43_test guardbuy_ism42_test guardbuy_ism15_test guardbuy_ism36_test guardbuy_ism141_test; do
            docker exec "$POSTGRES_CONTAINER_ID" createdb -U postgres "$test_database"
            test_database_url="postgresql://postgres:offline-only@127.0.0.1:5432/$test_database"
            DATABASE_URL="$test_database_url" DIRECT_URL="$test_database_url" npx prisma migrate deploy
          done
      - name: Build for production HTTP checks
        run: npm run build
      - name: Unpaid approvals on Postgres
        env:
          DATABASE_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism135_test
          DIRECT_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism135_test
        run: npx tsx scripts/check-unpaid-approvals-db.ts
      - name: Payment safety across processes
        env:
          DATABASE_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism43_test
          DIRECT_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism43_test
          GUARDBUY_TEST_EVIDENCE_PATH: payment-workers-results.json
        run: npx tsx scripts/check-payment-workers.ts
      - name: Privacy webhooks and owner erasure
        env:
          DATABASE_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism42_test
          DIRECT_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism42_test
          GUARDBUY_PRIVACY_EVIDENCE_PATH: privacy-results.json
          GUARDBUY_PRIVACY_SERVER_LOG: privacy-server.log
        run: npx tsx scripts/check-privacy.ts
      - name: Incoming stock and receipt lifecycle
        env:
          DATABASE_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism15_test
          DIRECT_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism15_test
          GUARDBUY_INCOMING_EVIDENCE_PATH: incoming-stock-results.json
        run: npx tsx scripts/check-delivery-lifecycle-db.ts
      - name: Telegram alerts and background delivery
        env:
          DATABASE_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism36_test
          DIRECT_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism36_test
          GUARDBUY_ALERT_EVIDENCE_PATH: alerts-results.json
        run: npx tsx scripts/check-alerts.ts
      - name: Consolidated merchant navigation
        env:
          DATABASE_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism141_test
          DIRECT_URL: postgresql://postgres:offline-only@127.0.0.1:5432/guardbuy_ism141_test
        run: |
          npx tsx scripts/check-navigation.ts
          npx tsx scripts/check-app-entry.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-workers-proof
          path: payment-workers-results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-proof
          path: |
            privacy-results.json
            privacy-server.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incoming-stock-proof
          path: incoming-stock-results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-alerts-proof
          path: alerts-results.json
          if-no-files-found: ignore
